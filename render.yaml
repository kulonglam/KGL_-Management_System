services:
  - type: web
    name: kgl-backend
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /readyz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_SWAGGER
        value: "false"
      - key: JWT_ISSUER
        value: https://kgl-backend-7mow.onrender.com
      - key: JWT_AUDIENCE
        value: karibu-groceries-api
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://kgl-frontend.onrender.com
      - key: BUSINESS_TIMEZONE
        value: Africa/Kampala
      - key: NIN_ENCRYPTION_KEY
        sync: false
      - key: BACKUP_UPLOAD_URL
        sync: false
      - key: BACKUP_UPLOAD_TOKEN
        sync: false

  - type: web
    name: kgl-backend-standby
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /readyz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_SWAGGER
        value: "false"
      - key: JWT_ISSUER
        value: https://kgl-backend-7mow.onrender.com
      - key: JWT_AUDIENCE
        value: karibu-groceries-api
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://kgl-frontend.onrender.com
      - key: BUSINESS_TIMEZONE
        value: Africa/Kampala
      - key: NIN_ENCRYPTION_KEY
        sync: false

  - type: cron
    name: kgl-backup
    runtime: node
    rootDir: backend
    schedule: "15 2 * * *"
    buildCommand: npm ci
    startCommand: npm run backup
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: BACKUP_UPLOAD_URL
        sync: false
      - key: BACKUP_UPLOAD_TOKEN
        sync: false

  - type: web
    name: kgl-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://kgl-backend-7mow.onrender.com/api
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://kgl-backend-7mow.onrender.com; form-action 'self'; worker-src 'self' blob:"
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), microphone=(), camera=(), payment=()
    routes:
      - type: rewrite
        source: /*
        destination: /index.html


