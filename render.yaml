services:
  - type: web
    name: kgl-backend
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /readyz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_SWAGGER
        value: "false"
      - key: JWT_ISSUER
        value: https://kgl-backend-7mow.onrender.com
      - key: JWT_AUDIENCE
        value: karibu-groceries-api
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://kgl-frontend.onrender.com
      - key: BUSINESS_TIMEZONE
        value: Africa/Kampala
      - key: NIN_ENCRYPTION_KEY
        sync: false
      - key: BACKUP_UPLOAD_URL
        sync: false
      - key: BACKUP_UPLOAD_TOKEN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMS_WEBHOOK_URL
        sync: false
      - key: SMS_WEBHOOK_TOKEN
        sync: false
      - key: SMS_RECEIPT_TOKEN
        sync: false
      - key: EFRIS_BASE_URL
        sync: false
      - key: EFRIS_API_KEY
        sync: false

  - type: web
    name: kgl-backend-standby
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /readyz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_SWAGGER
        value: "false"
      - key: JWT_ISSUER
        value: https://kgl-backend-7mow.onrender.com
      - key: JWT_AUDIENCE
        value: karibu-groceries-api
      - key: MONGODB_URI
        fromService:
          name: kgl-backend
          type: web
          envVarKey: MONGODB_URI
      - key: JWT_SECRET
        fromService:
          name: kgl-backend
          type: web
          envVarKey: JWT_SECRET
      - key: ALLOWED_ORIGINS
        fromService:
          name: kgl-backend
          type: web
          envVarKey: ALLOWED_ORIGINS
      - key: BUSINESS_TIMEZONE
        value: Africa/Kampala
      - key: NIN_ENCRYPTION_KEY
        fromService:
          name: kgl-backend
          type: web
          envVarKey: NIN_ENCRYPTION_KEY
      - key: SMTP_HOST
        fromService:
          name: kgl-backend
          type: web
          envVarKey: SMTP_HOST
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        fromService:
          name: kgl-backend
          type: web
          envVarKey: SMTP_USER
      - key: SMTP_PASS
        fromService:
          name: kgl-backend
          type: web
          envVarKey: SMTP_PASS
      - key: SMTP_FROM
        fromService:
          name: kgl-backend
          type: web
          envVarKey: SMTP_FROM
      - key: SMS_WEBHOOK_URL
        fromService:
          name: kgl-backend
          type: web
          envVarKey: SMS_WEBHOOK_URL
      - key: SMS_WEBHOOK_TOKEN
        fromService:
          name: kgl-backend
          type: web
          envVarKey: SMS_WEBHOOK_TOKEN
      - key: SMS_RECEIPT_TOKEN
        fromService:
          name: kgl-backend
          type: web
          envVarKey: SMS_RECEIPT_TOKEN
      - key: EFRIS_BASE_URL
        fromService:
          name: kgl-backend
          type: web
          envVarKey: EFRIS_BASE_URL
      - key: EFRIS_API_KEY
        fromService:
          name: kgl-backend
          type: web
          envVarKey: EFRIS_API_KEY

  - type: cron
    name: kgl-backup
    runtime: node
    rootDir: backend
    schedule: "15 2 * * *"
    buildCommand: npm ci
    startCommand: npm run backup
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        fromService:
          name: kgl-backend
          type: web
          envVarKey: MONGODB_URI
      - key: BACKUP_UPLOAD_URL
        fromService:
          name: kgl-backend
          type: web
          envVarKey: BACKUP_UPLOAD_URL
      - key: BACKUP_UPLOAD_TOKEN
        fromService:
          name: kgl-backend
          type: web
          envVarKey: BACKUP_UPLOAD_TOKEN

  - type: web
    name: kgl-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://kgl-backend-7mow.onrender.com/api
      - key: VITE_BUSINESS_TIMEZONE
        value: Africa/Kampala
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://kgl-backend-7mow.onrender.com; form-action 'self'; worker-src 'self' blob:"
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), microphone=(), camera=(), payment=()
    routes:
      - type: rewrite
        source: /*
        destination: /index.html


